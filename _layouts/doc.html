<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Eason Han</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<style>
.doc{max-width:760px; margin:0 auto; padding:0 24px 80px}
.backbar{padding:26px 0 0; font-size:14px}
.backbar a{color:var(--ink-3); font-weight:500}
.backbar a:hover{color:var(--accent)}
.doc h1{font-size:clamp(28px,5vw,38px); line-height:1.15; letter-spacing:-.02em; margin:26px 0 20px; font-weight:680}
.doc h2{
  font-size:22px; text-transform:none; letter-spacing:-.012em; color:var(--ink);
  font-weight:650; margin:52px 0 14px; padding-top:22px; border-top:1px solid var(--border);
}
.doc h3{font-size:17.5px; font-weight:640; letter-spacing:-.008em; margin:32px 0 10px; color:var(--ink)}
.doc p{margin:0 0 17px; color:var(--ink-2); font-size:16.5px; line-height:1.7}
.doc strong{color:var(--ink); font-weight:600}
.doc em{color:var(--ink-2)}
.doc ul,.doc ol{margin:0 0 18px; padding-left:24px; color:var(--ink-2); font-size:16.5px; line-height:1.7}
.doc li{margin-bottom:9px}
.doc li::marker{color:var(--ink-3)}
.doc blockquote{
  margin:24px 0; padding:16px 22px; border-left:3px solid var(--gold);
  background:var(--surface); border-radius:0 9px 9px 0;
}
.doc blockquote p{margin:0 0 10px; font-size:16px}
.doc blockquote p:last-child{margin-bottom:0}
.doc hr{border:0; border-top:1px solid var(--border); margin:44px 0}
.doc code{
  font:500 13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--tag-bg); padding:2px 6px; border-radius:4px; color:var(--ink);
}
.doc pre{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; overflow-x:auto; margin:0 0 20px;
}
.doc pre code{background:none; padding:0; font-size:12.8px; line-height:1.55; color:var(--ink-2); white-space:pre}
.tablewrap{overflow-x:auto; margin:0 0 22px; -webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse; width:100%; font-size:15px; min-width:420px}
.doc th{
  text-align:left; font-weight:640; color:var(--ink); padding:10px 14px;
  border-bottom:2px solid var(--border-strong); font-size:13.5px;
  letter-spacing:.02em; vertical-align:bottom;
}
.doc td{padding:11px 14px; border-bottom:1px solid var(--border); color:var(--ink-2); vertical-align:top; line-height:1.55}
.doc tr:last-child td{border-bottom:0}
.doc table strong{color:var(--ink)}
.doc footer{margin-top:56px; padding-top:26px; border-top:1px solid var(--border); font-size:14px; color:var(--ink-3)}
@media (max-width:560px){.doc{padding:0 18px 60px}.doc p,.doc ul,.doc ol{font-size:16px}}
</style>
</head>
<body>
<div class="doc">
  <div class="backbar"><a href="{{ '/' | relative_url }}">← Eason Han · Portfolio</a></div>
  {{ content }}
  <footer>
    <a href="{{ '/' | relative_url }}">← Back to portfolio</a> &nbsp;·&nbsp;
    <a href="mailto:eason_han@berkeley.edu">eason_han@berkeley.edu</a>
  </footer>
</div>
<script>
// wrap tables so wide ones scroll instead of breaking the page
document.querySelectorAll('.doc table').forEach(function(t){
  if(t.parentElement.classList.contains('tablewrap')) return;
  var w = document.createElement('div'); w.className = 'tablewrap';
  t.parentNode.insertBefore(w, t); w.appendChild(t);
});
</script>
</body>
</html>
