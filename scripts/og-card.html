<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#F3EFE8;color:#1F1D1A;font-family:"Hanken Grotesk",system-ui,sans-serif;position:relative;overflow:hidden}
  .frame{position:absolute;inset:0;padding:64px 80px 58px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline;font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#4B4740}
  .top .url{letter-spacing:.06em;text-transform:none;color:#67625A}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:330;font-size:104px;line-height:.98;letter-spacing:-.036em;margin-top:52px}
  h1 em{font-style:italic;font-weight:300;color:#1E5A43;letter-spacing:-.02em}
  svg{display:block;width:100%;height:30px;margin-top:auto}
  svg path{fill:none;vector-effect:non-scaling-stroke}
  .spec{display:flex;gap:56px;margin-top:18px}
  .spec dt{font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#67625A}
  .spec dd{margin-top:6px;font-size:21px;color:#1F1D1A}
  .spec .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1E5A43;margin-right:10px;vertical-align:2px}
</style>
<div class="frame">
  <div class="top"><span>Eason Han · Product management</span><span class="url">easonhanyc.github.io</span></div>
  <h1>Product thinking, and<br><em>the hands to build it</em>.</h1>
  <svg viewBox="0 0 1200 30" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 29.5 H760" stroke="rgba(31,29,26,.3)" stroke-width="1"/>
    <path d="M760 29.5 C 850 29.5, 890 0.5, 980 0.5" stroke="#1E5A43" stroke-width="2"/>
    <path d="M980 0.5 H1200" stroke="rgba(31,29,26,.3)" stroke-width="1"/>
  </svg>
  <dl class="spec">
    <div><dt>Now</dt><dd>MBA / MEng, UC Berkeley Haas &amp; IEOR</dd></div>
    <div><dt>Before</dt><dd>Three years at AWS</dd></div>
    <div><dt>Seeking</dt><dd><span class="dot"></span>Summer 2027 PM internship</dd></div>
  </dl>
</div>
