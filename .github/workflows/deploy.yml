name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # configure-pages only sets build_type when it *enables* Pages. This repo
      # was already enabled as a branch-based (Jekyll) site, which is why the
      # legacy "pages build and deployment" workflow kept firing and failing on
      # an Astro tree. Setting it explicitly is a different API call.
      - name: Build Pages from Actions, not the legacy Jekyll builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "before: $(gh api repos/${{ github.repository }}/pages --jq '.build_type // "none"' 2>&1)"
          gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow \
            && echo "set build_type=workflow" \
            || echo "could not set build_type — change it in Settings > Pages"
          echo "after:  $(gh api repos/${{ github.repository }}/pages --jq '.build_type // "none"' 2>&1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: withastro/action@v4
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
