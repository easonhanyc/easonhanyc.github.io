name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reports as a step conclusion rather than only in the log, so the result
      # is readable from the API. continue-on-error keeps a rejected call from
      # blocking the deploy — the site is published by the next two steps.
      - name: Force Pages build_type to workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{build_type, source}'
          gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: withastro/action@v4
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
